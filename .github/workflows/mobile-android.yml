name: Mobile Android build

on:
  pull_request:
    paths:
      - 'mobile-android/**'
      - '.github/workflows/mobile-android.yml'
  push:
    branches: [main]
    paths:
      - 'mobile-android/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: |
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p mobile-android :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: zeshu-android-debug
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
